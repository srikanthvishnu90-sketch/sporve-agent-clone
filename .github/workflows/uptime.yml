name: uptime
# Launch item 16: the first alerting that exists. Every 15 minutes, prove the
# things a director depends on are alive. A failing run emails the repo
# owner (GitHub's default on workflow failure) — no third-party service.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sporv.ai answers, and the deployment serves a built app
        # CHALLENGE-AWARE (2026-09-09). Vercel's bot mitigation answers
        # command-line clients on the custom domain with 403 plus an
        # x-vercel-challenge-token header; a real browser solves it in about a
        # second and gets the page (proven with a scripted Safari-UA browser).
        # So a bare 403 here means "you are not a browser", not "site down" —
        # treating it as an outage made this monitor cry wolf and, worse, its
        # own 15-minute cadence is the kind of traffic that provokes the
        # challenge. Reachability is checked on the domain; the page itself is
        # checked on the deployment alias, which serves the identical build.
        run: |
          head=$(curl -sS -I --connect-timeout 10 --max-time 20 https://sporv.ai)
          code=$(printf '%s' "$head" | head -1 | awk '{print $2}')
          if [ "$code" = "200" ]; then
            echo "sporv.ai=200"
          elif [ "$code" = "403" ] && printf '%s' "$head" | grep -qi 'x-vercel-challenge-token'; then
            echo "sporv.ai=403 (Vercel bot challenge — browsers pass this)"
          else
            echo "sporv.ai=$code — UNHEALTHY"; exit 1
          fi
          body=$(curl -sS --connect-timeout 10 --max-time 25 https://sporv1.vercel.app)
          echo "$body" | grep -q 'name="sporve-build"' || { echo "NO BUILD STAMP on the deployment — misdeployed"; exit 1; }
      - name: stripe-webhook function answers (unsigned POST must be refused, not 5xx)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 -X POST https://aveqjeafghmwafkbbnor.supabase.co/functions/v1/stripe-webhook -d '{}')
          echo "stripe-webhook=$code"; [ "$code" = "401" ] || [ "$code" = "400" ] || { echo "WEBHOOK UNHEALTHY"; exit 1; }
      - name: ai-gateway function is reachable (preflight)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 -X OPTIONS https://aveqjeafghmwafkbbnor.supabase.co/functions/v1/ai-gateway)
          echo "ai-gateway=$code"; [ "$code" = "200" ] || { echo "AI GATEWAY UNREACHABLE"; exit 1; }
      # KEY FROM THE CODE, NOT A SECRET (2026-09-22). The probe failed 401 all
      # day: the SUPABASE_ANON_KEY secret (set 09-19) and the literal fallback
      # both predate the current backend, while the page kept working with the
      # key in src/mod-api.js. That key is publishable by design — it ships in
      # every page load — so the probe reads it from the checked-out source and
      # can never drift from what the shipped app actually uses.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/mod-api.js
          sparse-checkout-cone-mode: false
      - name: database answers through PostgREST (anon read of plan_entitlements — the one table anon may read since 001068)
        run: |
          SUPABASE_ANON_KEY=$(sed -n 's/^ *var SUPABASE_ANON = "\([^"]*\)".*/\1/p' src/mod-api.js | head -1)
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "could not read SUPABASE_ANON from src/mod-api.js"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://aveqjeafghmwafkbbnor.supabase.co/rest/v1/plan_entitlements?select=plan&limit=1" -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "postgrest=$code"; [ "$code" = "200" ] || { echo "DATABASE/POSTGREST UNHEALTHY"; exit 1; }
