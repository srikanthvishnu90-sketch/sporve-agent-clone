# Supabase CLI configuration — functions only, on purpose.
#
# WHY THIS FILE EXISTS (robin audit 2026-09-08): every function listed below is
# deployed with verify_jwt = false because it authenticates its callers itself
# (a Stripe or Resend signature, an HMAC, an internal cron secret, or its own
# auth.getUser() check that returns 401). Until this file existed, that setting
# lived only in whoever remembered to type --no-verify-jwt at deploy time. One
# deploy without the flag would turn every Stripe webhook POST into a 401 and
# stop payments confirming, silently.
#
# Generated from the live deployment state of project tseszaprvtvqrkfpditu on
# 2026-09-08 (17 of 43 functions). Every other function keeps the platform
# default, verify_jwt = true, and is therefore not listed.
#
# If you add a function that verifies its own callers, add it here in the same
# pull request as the function.
project_id = "tseszaprvtvqrkfpditu"

[functions.AI-Chat]
verify_jwt = false

[functions.Join-Waitlist]
verify_jwt = false

[functions.camp-broadcast]
verify_jwt = false

[functions.camp-recap]
verify_jwt = false

[functions.draft-recap]
verify_jwt = false

[functions.draft-reply]
verify_jwt = false

[functions.join-waitlist]
verify_jwt = false

[functions.lifecycle-process]
verify_jwt = false

[functions.resend-webhook]
verify_jwt = false

[functions.setup-interview]
verify_jwt = false

[functions.staff-cert-webhook]
verify_jwt = false

[functions.stripe-connect-onboarding]
verify_jwt = false

[functions.stripe-create-checkout]
verify_jwt = false

[functions.stripe-provider-payouts]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.unsubscribe]
verify_jwt = false

[functions.waitlist-offer-draft]
verify_jwt = false

# Google redirects the customer's browser here with no Authorization header,
# so the platform gateway must not reject it. The function authenticates the
# round trip itself: a single-use, ten-minute state row minted by
# google-oauth-start. Without a matching state it does nothing at all.
[functions.google-oauth-callback]
verify_jwt = false

# Microsoft redirects the customer's browser here with no Authorization header,
# so the platform gateway must not reject it. The function authenticates the
# round trip itself: a single-use, ten-minute state row minted by
# microsoft-oauth-start. Without a matching state it does nothing at all.
[functions.microsoft-oauth-callback]
verify_jwt = false

# Intuit redirects the customer's browser here with no Authorization header,
# so the platform gateway must not reject it. The function authenticates the
# round trip itself: a single-use, ten-minute state row minted by
# intuit-oauth-start. Without a matching state it does nothing at all.
[functions.intuit-oauth-callback]
verify_jwt = false

# service_role only, invoked by the cron runner. It checks the bearer token
# against the service key itself, so the gateway check is belt-and-braces.
[functions.gmail-scan]
verify_jwt = false

# User-facing read dispatcher for connected third parties. The gateway
# verifies the JWT (verify_jwt stays true); the function re-verifies it to
# learn WHO the caller is, since connector rows are per-org.
[functions.connector-read]
verify_jwt = true

# ncsi-webhook authenticates the vendor with NCSI_WEBHOOK_SECRET (constant-time), not a JWT; fails closed when unset.
[functions.ncsi-webhook]
verify_jwt = false

# ── auth (owner 2026-09-16: sessions persist 90 days with silent refresh) ──
# The client (src/mod-auth.js) stores the session in localStorage and refreshes
# the access token 5 minutes before expiry, sharing one in-flight refresh.
# Access tokens are short; the REFRESH token is what makes a session last.
# In the hosted project these two are dashboard settings — set them there to
# the same values: Authentication → Sessions → "Time-box user sessions" OFF
# (or 90 days) and "Inactivity timeout" OFF; refresh-token rotation ON.
[auth]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[functions.calendar-feed]
# spec 12.5: parents subscribe from Google/Apple Calendar with no session; the
# 256-bit token in the URL is the credential and the DB is the only read path.
verify_jwt = false

[functions.guardian-link]
# spec 13 slice 1: the page a parent lands on from a magic link — no session,
# the token in the URL is the credential and the DB is the only read path.
verify_jwt = false
